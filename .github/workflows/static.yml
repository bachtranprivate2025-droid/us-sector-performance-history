name: Deploy Backtest

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare page
        run: |
          mkdir -p _site
          cp index.html history-data.js _site/
      - name: Refresh daily prices
        if: github.event_name != 'push'
        run: node refresh-history.mjs _site/history-data.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
